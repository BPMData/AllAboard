name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy allaboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Run unit and server tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production boot smoke check
        run: bash scripts/smoke.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Call gcloud directly: deploy-cloudrun's flag parser turns `--command=` into a bare
      # `--command`, which gcloud rejects. --command="" / --args="" reset AI Studio's leftover
      # entrypoint override so the Buildpacks launcher runs `npm start` (`node server.ts`) on 3000.
      # Problem reports (docs/REPORTS.md): the relay URL and token come from GitHub secrets of the same names.
      # Without the secrets the flag is left out, so the deploy is exactly as before and reports fall back to email.
      - name: Deploy to Cloud Run
        env:
          REPORT_RELAY_URL: ${{ secrets.REPORT_RELAY_URL }}
          REPORT_RELAY_TOKEN: ${{ secrets.REPORT_RELAY_TOKEN }}
        run: |
          REPORT_FLAGS=()
          if [ -n "$REPORT_RELAY_URL" ] && [ -n "$REPORT_RELAY_TOKEN" ]; then
            REPORT_FLAGS=(--update-env-vars "^@^REPORT_RELAY_URL=${REPORT_RELAY_URL}@REPORT_RELAY_TOKEN=${REPORT_RELAY_TOKEN}")
          fi
          gcloud run deploy allaboard \
            --source . \
            --region us-east1 \
            --project loyal-rookery-403218 \
            --allow-unauthenticated \
            --port 3000 \
            --max-instances 1 \
            --concurrency 1000 \
            --timeout 3600 \
            --session-affinity \
            --command "" \
            --args "" \
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}" \
            "${REPORT_FLAGS[@]}" \
            --quiet
