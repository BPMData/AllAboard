name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy allaboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Run unit and server tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Node 22 production type-stripping check
        run: node -e "import('./server.ts').then(() => console.log('OK'))"

      - name: Production boot smoke check
        run: |
          DATA_DIR="$(mktemp -d)"
          LOG="$(mktemp)"
          NODE_ENV=production PORT=3456 DATA_DIR="$DATA_DIR" node server.ts >"$LOG" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            kill -0 "$SERVER_PID" 2>/dev/null || { cat "$LOG"; exit 1; }
            if curl -sf http://127.0.0.1:3456/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3456/healthz | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:3456/ | grep -q '<div id="root">'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Call gcloud directly: deploy-cloudrun's flag parser turns `--command=` into a bare
      # `--command`, which gcloud rejects. --command="" / --args="" reset AI Studio's leftover
      # entrypoint override so the Buildpacks launcher runs `npm start` (`node server.ts`) on 3000.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy allaboard \
            --source . \
            --region us-east1 \
            --project loyal-rookery-403218 \
            --allow-unauthenticated \
            --port 3000 \
            --max-instances 1 \
            --concurrency 1000 \
            --timeout 3600 \
            --session-affinity \
            --command "" \
            --args "" \
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}" \
            --quiet
