name: Deploy to Cloud Run

on:
  workflow_call:

concurrency:
  group: deploy-cloudrun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy verified commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Workload Identity Federation: GitHub's OIDC token is exchanged for github-deployer credentials (no SA key).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # A slow check on an older merge can finish after the current main has deployed.
      - name: Confirm this commit is still main
        id: current
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi

      - name: Authenticate to Google Cloud
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/606573080592/locations/global/workloadIdentityPools/github/providers/allaboard
          service_account: github-deployer@loyal-rookery-403218.iam.gserviceaccount.com

      # Call gcloud directly: deploy-cloudrun's flag parser turns `--command=` into a bare
      # `--command`, which gcloud rejects. --command="" / --args="" reset AI Studio's leftover
      # entrypoint override so the Buildpacks launcher runs `npm start` (`node server.ts`) on 3000.
      - name: Verify authenticated source manifest
        if: steps.current.outputs.deploy == 'true'
        run: bash scripts/check-upload.sh

      - name: Deploy to Cloud Run
        if: steps.current.outputs.deploy == 'true'
        # Runs as allaboard-run, which can use gs://allaboard-data and read only its own two report-relay secrets.
        # Problem reports (docs/REPORTS.md): --set-secrets gives the server the relay URL and token from Secret Manager.
        run: |
          gcloud run deploy allaboard \
            --source . \
            --region us-east1 \
            --project loyal-rookery-403218 \
            --allow-unauthenticated \
            --port 3000 \
            --max-instances 1 \
            --concurrency 1000 \
            --timeout 3600 \
            --session-affinity \
            --command "" \
            --args "" \
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}" \
            --service-account allaboard-run@loyal-rookery-403218.iam.gserviceaccount.com \
            --set-secrets REPORT_RELAY_URL=allaboard-report-relay-url:latest,REPORT_RELAY_TOKEN=allaboard-report-relay-token:latest \
            --update-env-vars "RELEASE_SEQUENCE=$(date +%s)" \
            --quiet

      - name: Verify serving revision and room backups
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/check-release.mjs "$GITHUB_SHA"
