name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloud Build source manifest
        run: bash scripts/check-upload.sh

      - name: Typecheck (tsc)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npx prettier --check .

      - name: Run automated tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Production boot smoke check
        run: bash scripts/smoke.sh

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner's default EC2 mirror can slow to a crawl, turning a 30-second install into 10 minutes.
      - name: Use the main Ubuntu package server
        run: echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt

      - name: Install Chromium for Playwright
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Build and test the production classroom
        run: npm run build && npm run test:production

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test-and-build, e2e]
    # A called workflow can't get more token permissions than its caller grants; id-token is needed for WIF.
    # secrets: inherit still passes REPORT_RELAY_URL / REPORT_RELAY_TOKEN.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
